# GitLab CI Template para Iara Code Reviewer
# Copie este conteudo para o seu .gitlab-ci.yml ou use include.
#
# Variaveis necessarias (Settings > CI/CD > Variables):
#   - OPENROUTER_API_KEY: Chave da API OpenRouter (obrigatoria)
#   - GITLAB_TOKEN: Personal/Project Access Token com scope 'api' (para comentarios no MR)
#
# Suporta instancias auto-hospedadas: a URL do servidor e detectada automaticamente
# via CI_SERVER_URL (variavel predefinida do GitLab CI).

stages:
  - review

iara_code_review:
  stage: review
  image: ghcr.io/felipefernandes/iara:latest
  variables:
    OPENROUTER_API_KEY: $OPENROUTER_API_KEY
    GITLAB_TOKEN: $GITLAB_TOKEN
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git diff origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...$CI_COMMIT_SHA | iara --post-comment
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
