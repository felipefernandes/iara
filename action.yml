name: 'Iara Code Reviewer'
description: 'AI-powered code review for Pull Requests using OpenRouter LLMs. Reviews for bugs, security issues, and performance problems.'
author: 'Felipe Fernandes'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  openrouter_api_key:
    description: 'OpenRouter API key for LLM access'
    required: false
  openai_api_key:
    description: 'OpenAI API key for LLM access'
    required: false
  gemini_api_key:
    description: 'Google Gemini API key for LLM access'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key for LLM access'
    required: false
  groq_api_key:
    description: 'Groq API key for LLM access'
    required: false
  provider:
    description: 'LLM provider: openrouter (default), openai, gemini, anthropic, groq'
    required: false
    default: 'openrouter'
  model:
    description: 'LLM model to use (e.g., google/gemini-2.0-flash-exp:free). Defaults to auto-fallback.'
    required: false
    default: ''
  config_path:
    description: 'Path to .iara.json config file'
    required: false
    default: '.iara.json'
  post_comment:
    description: 'Whether to post review as PR comment (true/false)'
    required: false
    default: 'true'
  language:
    description: 'Review output language (en, pt-br, es, fr, etc.). Defaults to config file or en.'
    required: false
    default: ''
  index_codebase:
    description: 'Whether to index the codebase for RAG memory (true/false). Defaults to false.'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub token for API access. Defaults to github.token.'
    required: false
  github_repository:
    description: 'GitHub repository (owner/repo). Defaults to github.repository.'
    required: false
  github_event_path:
    description: 'Path to event payload. Defaults to github.event_path.'
    required: false

outputs:
  review:
    description: 'The code review output from Iara'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    INPUT_OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
    INPUT_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
    INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
    INPUT_GROQ_API_KEY: ${{ inputs.groq_api_key }}
    INPUT_PROVIDER: ${{ inputs.provider }}
    INPUT_MODEL: ${{ inputs.model }}
    INPUT_CONFIG_PATH: ${{ inputs.config_path }}
    INPUT_POST_COMMENT: ${{ inputs.post_comment }}
    INPUT_LANGUAGE: ${{ inputs.language }}
    INPUT_INDEX_CODEBASE: ${{ inputs.index_codebase }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GITHUB_REPOSITORY: ${{ inputs.github_repository }}
    GITHUB_EVENT_PATH: ${{ inputs.github_event_path }}
